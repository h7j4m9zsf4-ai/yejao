<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<title>真日聖會 - 更多</title>

<style>

body{

color:white;

}

.box{

width:700px;
margin:auto;

background:#111;

border:3px ridge gray;

padding:40px;

}

color:#FFD700;

}

input{

}

}

<body>

<div class="box">

<h1>更多</h1>

<p>

id="pw"
type="text"
placeholder="Password">

<br>

<button onclick="check()">

確認

</button>

<br><br>

<button onclick="location.href='home.html'">

返回首頁

</button>

<div id="hint">

D♭ ⮕ d2
G# ⮕ A♭ ⮕ a9
F ⮕ F6
(請善用網路資源並不要管大小調)

</div>

</div>

<script>

function check(){

let pw=document.getElementById("pw").value.trim();

if(

pw=="D3e4A10C19980717"

||

pw=="D3e4C119980717"

){

location.href="secret.html";

}

else{

document.getElementById("hint").style.display="block";

}

}

document.getElementById("pw").addEventListener("keydown",function(e){

if(e.key==="Enter"){

check();

}

});

</script>
