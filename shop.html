<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<title>真日聖會 - 法器購買</title>


<style>

body{

background:black;
color:white;
font-family:"Microsoft JhengHei";
text-align:center;
padding:40px;

}


.box{

width:950px;
max-width:90%;
margin:auto;

background:#111;

border:3px ridge gray;

padding:40px;

box-shadow:0 0 30px #333;

}


h1{

color:#FFD700;

font-size:45px;

text-shadow:0 0 15px orange;

}



.item{

background:#080808;

border:1px solid #666;

margin:25px;

padding:20px;

font-size:20px;

}



.price{

color:#ff4444;

font-size:25px;

}



button{

padding:8px 18px;

font-size:18px;

margin:5px;

cursor:pointer;

}



.cart{

border-top:2px solid gray;

margin-top:40px;

padding-top:30px;

}



input{

font-size:18px;

padding:8px;

margin:8px;

width:300px;

}



input:read-only{

background:#555;

color:white;

}



.red{

color:red;

font-weight:bold;

}

  #birthday::placeholder{

color:red;

opacity:1;

}

/* 使用者實際輸入的文字維持白色 */
#birthday{

color:white;

}



#complete{

display:none;

font-size:25px;

color:#FFD700;

}



</style>

</head>


<body>


<div class="box">


<h1>

☀ 真日聖會・法器購買處 ☀

</h1>


<hr>


<p>

「完成真日確認後，法器將由教區寄送。」

</p>



<!-- 法器 -->


<div class="item">

<h2>晨光之鏡</h2>

<p>記錄每日光象變化之器具。</p>

<div class="price">

88,888 元

</div>

<button onclick="change(0,-1)">－</button>

<span id="q0">0</span>

<button onclick="change(0,1)">＋</button>

</div>




<div class="item">

<h2>八相之印</h2>

<p>記載教主八種型態的特殊印記。</p>

<div class="price">

188,888 元

</div>

<button onclick="change(1,-1)">－</button>

<span id="q1">0</span>

<button onclick="change(1,1)">＋</button>

</div>




<div class="item">

<h2>真日聖典</h2>

<p>保存早期教義紀錄。</p>

<div class="price">

299,999 元

</div>

<button onclick="change(2,-1)">－</button>

<span id="q2">0</span>

<button onclick="change(2,1)">＋</button>

</div>




<div class="item">

<h2>光之羅盤</h2>

<p>尋找真日方向的古老工具。</p>

<div class="price">

666,666 元

</div>

<button onclick="change(3,-1)">－</button>

<span id="q3">0</span>

<button onclick="change(3,1)">＋</button>

</div>




<div class="item">

<h2>教主紀念像</h2>

<p>最高階成員收藏物。</p>

<div class="price">

999,999 元

</div>

<button onclick="change(4,-1)">－</button>

<span id="q4">0</span>

<button onclick="change(4,1)">＋</button>

</div>





<div class="cart">


<h2>

購物車

</h2>


商品數量：

<span id="total">

0

</span>


<br>


總金額：

<span id="money">

0

</span>

元



<hr>



<h2>

訂單確認資料

</h2>



姓名：

<br>

<input

value="林小洋"

readonly>


<br>



使用者地址：

<br>

<input

value="台北市士林區芝山路88號"

readonly>


<br>



卡號：

<br>

<input

value="4528-1998-7788-0017"

readonly>


<br>



生日：

<br>

<input
id="birthday"
placeholder="YYYYMMDD"
style="color:red;">

<br>



介紹人：

<br>

<input

id="introducer"

placeholder="輸入介紹人">


<br>



<button onclick="submitOrder()">

完成訂單

</button>


<br>


<button onclick="location.href='home.html'">

返回首頁

</button>



</div>





<div id="complete">


</div>



</div>





<script>


let prices=[

88888,

188888,

299999,

666666,

999999

];


let qty=[0,0,0,0,0];



function change(i,n){


qty[i]+=n;


if(qty[i]<0){

qty[i]=0;

}



document.getElementById("q"+i).innerHTML=

qty[i];



let total=0;

let money=0;



for(let j=0;j<qty.length;j++){

total+=qty[j];

money+=qty[j]*prices[j];

}



document.getElementById("total").innerHTML=

total;



document.getElementById("money").innerHTML=

money.toLocaleString();



}





function submitOrder(){



let birthday=

document.getElementById("birthday").value;



let introducer=

document.getElementById("introducer").value;




if(

birthday=="20080529"

&&

introducer=="羽毛球"

){



document.querySelector(".cart").style.display="none";



document.getElementById("complete").style.display="block";



document.getElementById("complete").innerHTML=


`

<hr>


<h2>

☀ 訂單完成 ☀

</h2>


<p>

您的法器已從

<span class="red">

南投縣埔里鎮真日聖山路108號

</span>

寄來。

</p>


<p>

教區確認完成。

<br>

等待下一階段指示。

</p>



<button onclick="location.href='home.html'">

返回首頁

</button>

`;



}

else{


alert("生日或介紹人錯誤，無法完成訂單。");

}



}



</script>


</body>

</html>
