<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<title>真日聖會 官方網站</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{

    background:#000;
    color:#FFD700;
    font-family:"PMingLiU","新細明體",serif;

    margin:0;
    padding-top:70px;

    text-align:center;

    overflow-x:hidden;

}


/* CRT掃描線 */

body::after{

content:"";

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.04) 0px,
rgba(255,255,255,.04) 2px,
transparent 4px
);

opacity:.3;

}


/* 跑馬燈 */

marquee{

background:#330000;

color:white;

padding:10px;

font-size:18px;

border-top:1px solid #777;
border-bottom:1px solid #777;

}


/* 主框 */

.main{

width:900px;

max-width:90%;

margin:60px auto;

background:#111;

border:3px ridge gray;

padding:35px;

box-shadow:
0 0 20px #333,
0 0 50px #111;

}


/* 標題 */

h1{

font-size:60px;

margin:10px;

text-shadow:
0 0 10px orange,
0 0 30px red;

animation:flicker 3s infinite;

}


h2{

color:white;

font-size:26px;

font-weight:normal;

}


/* 閃爍 */

@keyframes flicker{

0%,18%,22%,60%,100%{
opacity:1;
}

20%,61%{
opacity:.5;
}

}


/* 文字 */

.intro{

font-size:25px;

color:white;

line-height:2;

}


/* 人數 */

.counter{

margin-top:50px;

font-size:28px;

}


.number{

font-size:60px;

color:white;

text-shadow:

0 0 10px red;

}



/* checkbox */

label{

font-size:22px;

color:#ddd;

}



/* 按鈕 */

button{

margin-top:35px;

padding:15px 50px;

font-size:22px;

font-family:"PMingLiU";

background:#c0c0c0;

border:3px outset white;

cursor:pointer;

}


button:hover{

box-shadow:

0 0 20px red;

}


button:active{

border:3px inset white;

}



/* footer */

.footer{

margin-top:50px;

font-size:15px;

color:#777;

}



/* 進入動畫 */

.flash{

animation:flash .5s;

}


@keyframes flash{

from{
filter:brightness(5);
}

to{
filter:brightness(1);
}

}


</style>

</head>



<body>



<marquee scrollamount="5">

★ 真日聖會 官方網站 ★　
真光正在等待有緣人　
★ 1998 年建立 ★　
資料僅供虛構世界觀使用 ★

</marquee>



<div class="main">


<h1>
☀ 真日聖會 ☀
</h1>


<hr>



<h2>

真正的光，不屬於所有人。

</h2>



<p class="intro">

歡迎來到真日聖會官方網站。<br>

只有通過試煉者，才能看見真光。

</p>



<div class="counter">

你是第

<div class="number" id="people">
00000
</div>

位訪客

</div>



<br><br>



<label>

<input type="checkbox" id="agree">

我願閱讀真日聖會公開資料。

</label>



<br>



<button id="enter" disabled>

進入聖域

</button>




<div class="footer">

<hr>

Since 1998<br>

The Truth Awaits.

</div>



</div>





<script>


// 假訪客數

let n=Math.floor(Math.random()*4000)+25000;

document.getElementById("people").innerHTML=
n.toLocaleString();



let agree=document.getElementById("agree");

let btn=document.getElementById("enter");



agree.onchange=function(){


if(this.checked){

btn.disabled=false;

btn.style.background="#660000";

btn.style.color="white";


}

else{


btn.disabled=true;

btn.style.background="#c0c0c0";

btn.style.color="black";


}


};





btn.onclick=function(){


document.body.classList.add("flash");


setTimeout(function(){

window.location.href="home.html";

},500);


};




// CRT故障閃爍

setInterval(function(){


document.body.style.opacity="0.92";


setTimeout(function(){

document.body.style.opacity="1";

},100);



},8000);



</script>



</body>

</html>
