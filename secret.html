<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人簡介 - 林小洋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f9fa;
            color: #333333;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }

        .profile-card {
            width: 550px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 40px;
            border: 1px solid #eef2f5;
        }

        header {
            text-align: center;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            color: #222;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
        }

        .info-group {
            margin-bottom: 22px;
        }

        .info-title {
            font-size: 15px;
            font-weight: 700;
            color: #2b5876;
            margin-bottom: 8px;
            border-left: 3px solid #2b5876;
            padding-left: 8px;
        }

        .info-content {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
            padding-left: 11px;
        }

        .footer-action {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
        }

        button {
            background-color: #2b5876;
            color: #ffffff;
            border: none;
            padding: 9px 24px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1e3c72;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <header>
        <h1>林傅洋</h1>
        <div class="subtitle">個人基本資料</div>
    </header>

    <!-- 基本資訊與住處 -->
    <div class="info-group">
        <div class="info-title">基本資料</div>
        <div class="info-content">
            <p><strong>居住地：</strong>桃園市</p>
            <p><strong>聯絡信箱：</strong>franklin666@email.com</p>
            <p><strong>生理特徵 / 備註：</strong>汗腺發達，脫鞋後腳臭味極具辨識度</p>
        </div>
    </div>

    <!-- 學歷背景 -->
    <div class="info-group">
        <div class="info-title">學歷背景</div>
        <div class="info-content">
            <p><strong>國立陽明交通大學</strong> 電機系（學士）</p>
          
            <p style="margin-top: 6px;"><strong>武陵高中</strong> 普通科</p>

        </div>
    </div>

    <!-- 簡要自述 -->
    <div class="info-group">
        <div class="info-title">簡介</div>
        <div class="info-content">
            <p>表面上是4.3，私底下其實是腳臭廣智，回宿舍第一件事是趕快去洗腳以免毒氣外洩。</p>
        </div>
    </div>

    <div class="footer-action">
        <button onclick="location.href='home.html'">返回首頁</button>
    </div>
</div>

</body>
</html>
