<hr>



<h2>

「遵循光之規律，方能避免被光遺忘。」

</h2>



<div class="rule">


<p>

第一條：每日需確認自己仍存在於真日之中。
  
若今日感到與昨日相同，代表試煉尚未開始。

</p>


<p>

第二條：不可追問光的來源。
  
因為尋找答案的人，最後會成為答案的一部分。

</p>


<p>

第三條：當所有人保持沉默時，請勿第一個發言。
  
真正聽見聲音的人，知道何時該閉嘴。
  
</p>


<p>

第四條：所有儀式紀錄需完整保存，

<span class="red">加上</span>

每日心得回報，使真日能確認成員與光之連結。

</p>


<p>

第五條：若聽見無人呼喚自己的名字，

請保持安靜，不要回應。

因為真正的召喚，不需要第二次確認。

</p>



<p>

第六條：離開真光者，不代表失去道路。
  
只是道路不再需要他。

</p>
